<!doctype html>
<html lang="en-AU"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Labour">
<meta name="theme-color" content="#23271A">
<meta name="robots" content="noindex,nofollow">
<title>ELISE Jobs</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--bg:#23271A;--card:#2D3221;--rule:#3E4431;--ink:#E8E2D8;--ink2:#C6C7B9;
  --ink3:#9EA090;--accent:#DCCAA2;--go:#2FD44A;--pri:#DCCAA2;--stop:#FF6B6B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:0 0 40px;text-transform:uppercase;letter-spacing:.015em}
/* Buttons do not inherit text-transform from the UA sheet, and every job row is a button, so the list would stay sentence case without this. */
button,select{text-transform:inherit;letter-spacing:inherit}
.wrap{max-width:720px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);
  padding:12px 0 10px}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand b{font-size:18px;letter-spacing:.16em}
.me{margin-left:auto;appearance:none;border:1px solid var(--rule);background:transparent;
  color:var(--ink);font:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;
  padding:6px 10px;border-radius:999px;cursor:pointer;text-transform:uppercase}
.me:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;appearance:none;border:1px solid var(--rule);background:transparent;color:var(--ink2);
  font:inherit;font-size:13px;font-weight:700;padding:8px 6px;border-radius:8px;cursor:pointer;
  letter-spacing:.06em;text-transform:uppercase}
.tab b{display:block;font-size:15px;margin-top:2px;letter-spacing:0}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);border-color:var(--accent)}
/* Sections carry weight, not just a grey label. One header treatment
   throughout, with the count as a figure rather than prose. */
.sec{display:flex;align-items:baseline;gap:9px;margin:26px 0 0;
  padding-bottom:7px;border-bottom:1.5px solid var(--rule)}
.sec h2{margin:0;font-size:12px;letter-spacing:.15em;text-transform:uppercase;
  font-weight:800;color:var(--ink2)}
.sec .n{font-size:12px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.sec .hint{margin-left:auto;font-size:11px;color:var(--ink3);letter-spacing:.03em}
.sec.pri h2{color:var(--pri)}
.sec.daily h2{color:var(--accent)}

/* ---- landscape ----
   On a phone held sideways, a tablet, or the shed screen, the page has twice
   the width and half the height. One tall column wastes all of it, so the
   list flows into columns and the rows tighten up: the whole day on screen
   without a scroll. A section header never ends up stranded at the foot of a
   column away from its own jobs. */
@media (min-width:820px){ .wrap{max-width:1180px} }
/* a short screen - a phone on its side - wants the rows closer together
   more than it wants the breathing room */
@media (max-height:560px) and (orientation:landscape){
  .wrap{max-width:none}
  #list .sec{margin-top:12px;padding-bottom:5px}
  .job{padding:8px 0}
  .jt{font-size:14px;line-height:1.3}
  header{padding:8px 0 7px}
  .tabs{margin-top:7px}
}

/* A job is a line on a docket. Big square box you can hit with a glove on,
   the words at a readable size, and the age of the thing where you can see
   it - a job sitting since the 3rd is a different problem from one raised
   this morning. */
.jobrow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;border-bottom:1px solid var(--rule);
  break-inside:avoid;page-break-inside:avoid}
.jobrow:last-child{border-bottom:none}
.job{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;
  flex:1 1 auto;min-width:0;text-align:left;background:transparent;border:none;
  color:inherit;font:inherit;cursor:pointer;
  padding:13px 0 13px 0;position:relative}
/* Priority in one tap, from the list, without opening anything. */
.star{flex:0 0 auto;align-self:center;background:transparent;border:none;cursor:pointer;
  color:var(--ink3);font-size:19px;line-height:1;padding:10px 2px 10px 8px;
  min-width:38px;text-align:right}
.star[aria-pressed="true"]{color:var(--pri)}
.star:hover{color:var(--pri)}
.star:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
/* Nothing on this page had a way to say "that didn't save" outside the job
   sheet, and a star that silently fails is worse than no star. */
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;
  font-size:13px;font-weight:600;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.35);
  max-width:min(90vw,420px);text-align:center}
.box{width:26px;height:26px;border:2px solid var(--ink3);border-radius:4px;
  display:grid;place-items:center;font-size:15px;line-height:1;color:transparent;
  margin-top:1px;transition:background .12s,border-color .12s}
.job:hover .box{border-color:var(--ink2)}
.job.done .box{background:var(--go);border-color:var(--go);color:#0E1F0D}
.jt{font-size:15px;line-height:1.4;overflow-wrap:anywhere;display:block}
.job.done .jt{color:var(--ink3);text-decoration:line-through;
  text-decoration-color:var(--ink3);text-decoration-thickness:1px}

/* Priority earns a physical edge rather than a glyph you have to hunt for. */
.job.pri{padding-left:13px}
.job.pri::before{content:"";position:absolute;left:0;top:11px;bottom:11px;
  width:3px;border-radius:2px;background:var(--pri)}
.job.pri .jt{color:var(--ink)}

.meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:6px}
.who{font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--ink3);
  text-transform:uppercase}
/* How long it has been carried. Hot once it has been sitting a week. */
.age{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--ink3);
  border:1px solid var(--rule);border-radius:3px;padding:1px 5px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.age.warm{color:var(--pri);border-color:color-mix(in srgb,var(--pri) 45%,transparent)}
.age.hot{color:var(--stop);border-color:color-mix(in srgb,var(--stop) 45%,transparent)}
.tagnew{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
  border-radius:3px;padding:1px 5px;text-transform:uppercase}
.ev{display:block;font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.45}
.ev b{color:var(--ink2);font-weight:700}
.evimg{margin-top:7px}
.evimg img{width:56px;height:56px;object-fit:cover;border-radius:5px;
  border:1px solid var(--rule);display:block}

/* The daily run-through is a block of its own: an inset rule rather than a
   floating card, so it reads as part of the day without competing with the
   priority work above it. */
.dwrap{border-left:2px solid color-mix(in srgb,var(--accent) 40%,transparent);
  padding-left:13px;margin-top:4px}
.dwrap.pwrap{border-left-color:var(--pri)}
.dwrap.nwrap{border-left-color:var(--rule)}
.dwrap .job.pri{padding-left:0}
.dwrap .job.pri::before{display:none}
.dwrap .job{grid-template-columns:22px 1fr auto}

/* Priority or not - a plain drop-down, on every row and in the job sheet */
/* the row: job button full width, the priority drop-down tucked into the
   bottom right on the who / date line, so it costs no width */
.jmain{position:relative;flex:1 1 100%;min-width:0;display:flex}
.jmain .prisel:not(.big){position:absolute;right:0;bottom:9px}
.meta.withpri{padding-right:78px;min-height:20px}
.prisel{flex:0 0 auto;align-self:center;appearance:none;-webkit-appearance:none;cursor:pointer;
  font:600 9.5px/1 inherit;font-family:inherit;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);
  background-color:transparent;border:1px solid var(--rule);border-radius:4px;padding:3px 15px 3px 5px;height:20px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 8px) 50%,calc(100% - 5px) 50%;background-size:3px 3px;background-repeat:no-repeat}
.prisel.on{color:var(--pri);border-color:var(--pri)}
.prisel option{color:#111;background:#fff}
.prisel.big{width:100%;margin-top:6px;font-size:14px;padding:11px 26px 11px 12px;text-transform:none;letter-spacing:0}
.prilab{display:block;margin-top:16px}

/* Priority is a state you set, not a form field, so it reads as a switch. */
.prib{display:flex;align-items:center;gap:10px;width:100%;margin-top:16px;
  appearance:none;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
  padding:11px 13px;border-radius:7px;border:1px solid var(--rule);
  background:transparent;color:var(--ink2);text-align:left}
.pdot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink3);flex:0 0 auto}
.prib[aria-pressed="true"]{border-color:var(--pri);color:var(--pri)}
.prib[aria-pressed="true"] .pdot{background:var(--pri);border-color:var(--pri)}

/* Who is on the job today, under the list - context, not a thing to act on. */
.crew{margin-top:28px;padding-top:14px;border-top:1px solid var(--rule)}
.crew h3{margin:0 0 10px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;
  font-weight:800;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;flex-direction:column;gap:1px;border:1px solid var(--rule);
  border-left:3px solid var(--rule);border-radius:7px;padding:7px 11px;min-width:0}
.chip b{font-size:12.5px;font-weight:700;letter-spacing:.05em}
.chip span{font-size:10.5px;color:var(--ink3);letter-spacing:.03em}
.chip.me{border-color:var(--accent)}
.chip.me b{color:var(--accent)}
.crew .none{font-size:13px;color:var(--ink3);line-height:1.5}
.dwrap .job{padding-top:10px;padding-bottom:10px}
.dwrap .jt{font-size:14.5px}

/* ---- compact: priority | non-priority side by side ---- */
.jcols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:stretch;position:relative}
.jcols::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--rule);transform:translateX(-.5px)}
.jcols > *{min-width:0}
.jcols .jobrow{border-bottom:1px solid var(--rule)}
.jcols .jobrow:last-child{border-bottom:1px solid var(--rule)}
.jcol{min-width:0}
.cnone{margin:8px 0 0;font-size:12px;color:var(--ink3)}
.sec{margin-top:16px;padding-bottom:5px}
#list > .jcols:first-child .sec{margin-top:10px}
@media (max-width:330px){ .jcols{grid-template-columns:1fr} .jgap{display:none} }
.job{padding:8px 0;gap:9px;grid-template-columns:22px 1fr}
.box{width:22px;height:22px;font-size:13px;border-width:1.5px}
.jt{font-size:14px;line-height:1.3}
.meta{margin-top:3px}
.star{padding:6px 0 6px 4px;min-width:26px;font-size:17px}
.dwrap .job{padding-top:6px;padding-bottom:6px}
.dwrap .jt{font-size:13.5px}
.addbtn{margin-top:12px;padding:9px;font-size:13px}
.crew{margin-top:16px;padding-top:10px}
.chip{padding:5px 9px}
.tabs{margin-top:7px}
.tab{padding:6px;font-size:12px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab b{display:inline;font-size:12px;margin:0 0 0 6px;color:var(--ink3)}
.tab[aria-selected="true"] b{color:var(--accent)}
header{padding:8px 0 7px}
@media (max-width:420px){
  .jcols{gap:0 10px}
  .jt{font-size:13px}
  .job{gap:7px;grid-template-columns:20px 1fr}
  .box{width:20px;height:20px}
  .star{min-width:22px;font-size:16px;padding-left:2px}
  .job.pri{padding-left:9px}
}
@media (max-width:330px){ .jcols{grid-template-columns:1fr} }
.empty{padding:30px 0;text-align:center;color:var(--ink3);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink2);font-size:15px;margin-bottom:4px}
.addbtn{width:100%;margin-top:18px;appearance:none;border:1px dashed var(--rule);
  background:transparent;color:var(--ink2);font:inherit;font-size:14px;font-weight:600;
  padding:13px;border-radius:8px;cursor:pointer}
.addbtn:hover{border-color:var(--accent);color:var(--accent)}
footer{margin-top:24px;padding-top:12px;border-top:1px solid var(--rule);font-size:11px;
  color:var(--ink3);letter-spacing:.04em;display:flex;justify-content:space-between;gap:10px}

.scrim{position:fixed;inset:0;background:rgba(10,9,8,.66);z-index:50;display:flex;
  align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:88dvh;overflow-y:auto;
  background:var(--card);border:1px solid var(--rule);border-radius:12px 12px 0 0;padding:16px}
.sheet h2{margin:0 0 4px;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.sheet p.q{margin:0 0 14px;font-size:14.5px;line-height:1.4;color:var(--ink2)}
.sheet label{display:block;font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink3);font-weight:700;margin:12px 0 5px}
.sheet input[type=text],.sheet textarea{width:100%;font:inherit;font-size:16px;padding:10px;
  border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink)}
.sheet textarea{min-height:74px;resize:vertical}
.names{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.name{appearance:none;border:1px solid var(--rule);background:transparent;color:var(--ink);
  font:inherit;font-size:14px;font-weight:600;padding:9px 13px;border-radius:999px;cursor:pointer}
.name:hover,.name[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.shot{display:flex;gap:10px;align-items:center;margin-top:6px}
.shot img{width:62px;height:62px;object-fit:cover;border-radius:6px;border:1px solid var(--rule)}
.acts{position:sticky;bottom:0;background:var(--card);padding-top:14px;margin-top:16px;
  padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);
  display:flex;gap:8px}
.btn{flex:1;appearance:none;font:inherit;font-size:15px;font-weight:700;padding:12px;
  border-radius:7px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
.btn.go{background:var(--go);border-color:var(--go);color:#10210F}
.btn:disabled{opacity:.5}
label.btn{display:inline-flex;align-items:center;justify-content:center}
/* A job can't be closed out without a photo, so when they try, ring the
   photo row rather than leaving them hunting for what the message means. */
.shot.need{outline:2px solid var(--stop);outline-offset:5px;border-radius:7px}
.offscreen{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.offscreen:focus-visible + label.btn{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:12.5px;color:var(--stop);margin-top:8px;min-height:16px}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--pri:#6F6A4C;--bg:#E8E2D8;--card:#F5F1EA;
  --rule:#D2CBBC;--ink:#2D3221;--ink2:#4E5340;--ink3:#717462;--stop:#B3261E;--accent:#2D3221}}
:root[data-theme="light"]{--pri:#6F6A4C;--bg:#E8E2D8;--card:#F5F1EA;--rule:#D2CBBC;--ink:#2D3221;--ink2:#4E5340;--ink3:#717462;--stop:#B3261E;--accent:#2D3221;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}


/* the ELISE logo, tinted to the theme's ink so it reads on light and dark */
.elogo{display:inline-block;width:86px;height:23px;background:var(--ink);
  -webkit-mask:url(../board/elise-logo.png) no-repeat left center/contain;mask:url(../board/elise-logo.png) no-repeat left center/contain;
  color:transparent;overflow:hidden;white-space:nowrap;vertical-align:middle;flex:none}

/* light / dark switch - shares the board's choice (same phone, same setting) */
.thbtn{appearance:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:transparent;
  color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none}
.thbtn svg{width:17px;height:17px}

/* iPhone zooms the page into any text box set smaller than 16px - keep every
   box at 16px on touch screens so typing never zooms */
@media (pointer:coarse){input,textarea,select:not(.prisel),.prisel.big,[contenteditable="true"]{font-size:16px!important}}
.jobrow > .job{flex:1 1 0}
.jphs{flex:1 1 100%;display:flex;gap:6px;flex-wrap:wrap;padding:0 0 10px 34px}
.jphs img{width:72px;height:54px;object-fit:cover;border-radius:4px;border:1px solid var(--rule);display:block}
.sec.fold{cursor:pointer;user-select:none}
.sec.fold .chev{margin-left:auto;font-size:13px;color:var(--ink3);transition:transform .15s}
.sec.fold .hint+.chev{margin-left:10px}
.sec.fold.shut .chev{transform:rotate(-90deg)}
.sec.fold.shut{opacity:.85}
.foldbody[hidden]{display:none}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 0}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr);gap:12px}}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:108px;padding:12px 4px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;text-align:center}
.tile:active{border-color:var(--accent)}
.tile svg{width:32px;height:32px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;line-height:1.2}
.tile span{font-size:11px;color:var(--ink3);line-height:1.25}
.tile.hot{border-color:var(--pri)}
.tile i{position:absolute;top:6px;right:6px;min-width:22px;height:22px;border-radius:11px;background:var(--stop);color:#1a0d0d;font:800 12px/22px system-ui,sans-serif;font-style:normal;padding:0 6px}
.backbtn{appearance:none;margin:12px 0 2px;font:inherit;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:10px 14px;border:1px solid var(--rule);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer;min-height:44px}
#crew[hidden],#addBtn[hidden]{display:none}

/* crisper type: grayscale smoothing on dark, real kerning, a touch more contrast in the greys */
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-kerning:normal}
</style>
<script>
(function(){
  var r=document.documentElement;
  try{var t=localStorage.getItem("elise-theme");if(t==="light"||t==="dark")r.setAttribute("data-theme",t);}catch(e){}
  var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function cur(){var a=r.getAttribute("data-theme");if(a)return a;return matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";}
  function paint(){var b=document.getElementById("thBtn");if(b)b.innerHTML=cur()==="dark"?SUN:MOON;
    var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",cur()==="dark"?"#23271A":"#E8E2D8");}
  document.addEventListener("DOMContentLoaded",function(){
    paint();
    var b=document.getElementById("thBtn"); if(!b) return;
    b.addEventListener("click",function(){var t=cur()==="dark"?"light":"dark";r.setAttribute("data-theme",t);
      try{localStorage.setItem("elise-theme",t);}catch(e){} paint();});
  });
})();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b class="elogo" role="img" aria-label="ELISE">ELISE</b>
      <span style="margin-left:auto;display:flex;gap:8px;align-items:center"><button class="thbtn" id="thBtn" type="button" aria-label="Switch light or dark" title="Light / dark"></button><button class="me" id="meBtn">Who am I?</button></span></div>

<script>
(function(){
"use strict";
var URL_="https://glusxwsivbbzmgwizkfs.supabase.co", KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdsdXN4d3NpdmJiem1nd2l6a2ZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMTcyNDQsImV4cCI6MjEwOTc5MzI0NH0.Ft-_9gst873leku1VVJ1PoTwZNTFiB_AoPzDNYdsqaI";
var H={apikey:KEY,Authorization:"Bearer "+KEY};
var JH={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
var BUCKET="job-photos";
var view=null;
var day=dayFromHash(), rows=[], me="", pending=null, shotFile=null, daily=null, dlog={}, crew=[], priWant=false;
var trades=null;

function p2(n){return ("0"+n).slice(-2)}
function iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function dateFor(o){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+o);return d}
/* The board links here with the day it is showing on the end - #2026-11-14 -
   so tapping Labour from Saturday's board opens Saturday's list, not this
   phone's idea of today. Anything else in the hash is ignored. */
function dayFromHash(){
  var m=/^#(\d{4})-(\d{2})-(\d{2})$/.exec(location.hash||"");
  if(!m) return 0;
  var want=new Date(+m[1],+m[2]-1,+m[3]); want.setHours(12,0,0,0);
  var now=new Date(); now.setHours(12,0,0,0);
  var off=Math.round((want-now)/86400000);
  return (off>=-30&&off<=30)?off:0;
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
    MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function nice(d){return DAYS[d.getDay()]+" "+d.getDate()+" "+MONS[d.getMonth()]}
function el(id){return document.getElementById(id)}
function photoURL(id){return URL_+"/storage/v1/object/public/"+BUCKET+"/"+id+".jpg"}
var jobPh={};
function boardPhotoURL(ph){return URL_+"/storage/v1/object/public/"+(ph.bkt||"photos")+"/"+ph.id+".jpg"}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9)}

/* ---------- who am I ---------- */
function loadMe(){ try{ return localStorage.getItem("elise.me")||""; }catch(e){ return ""; } }
function saveMe(n){ try{ localStorage.setItem("elise.me", n); }catch(e){} me=n; paintMe(); }
function paintMe(){ el("meBtn").textContent = me || "Who am I?"; }

var toastT=null;
function toast(msg){
  var t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast";
          document.body.appendChild(t); }
  t.textContent=msg; t.hidden=false;
  clearTimeout(toastT);
  toastT=setTimeout(function(){ t.hidden=true; },3200);
}

function askWho(){
  var box=el("names"); box.innerHTML="Loading&hellip;";
  el("whoScrim").hidden=false; el("whoMsg").textContent="";
  el("otherName").value = "";
  fetch(URL_+"/rest/v1/v_crew?select=name&order=last_on_site.desc&limit=30",{headers:H})
    .then(function(r){return r.json()})
    .then(function(list){
      box.innerHTML = (list||[]).map(function(c){
        return '<button class="name" type="button" data-n="'+esc(c.name)+'"'+
               (c.name===me?' aria-pressed="true"':'')+'>'+esc(c.name)+'</button>';
      }).join("") || '<span style="color:var(--ink3);font-size:13px">No names on record yet &mdash; type yours below.</span>';
      Array.prototype.forEach.call(box.querySelectorAll("[data-n]"),function(b){
        b.addEventListener("click",function(){
          saveMe(b.getAttribute("data-n"));
          el("whoScrim").hidden=true; render();
        });
      });
    }).catch(function(){ box.innerHTML='<span style="color:var(--ink3);font-size:13px">Couldn\'t load the crew list &mdash; type your name below.</span>'; });
}
el("meBtn").addEventListener("click", askWho);
el("whoSave").addEventListener("click", function(){
  var n=el("otherName").value.trim().toUpperCase();
  if(!n){ el("whoMsg").textContent="Tap a name or type yours."; return; }
  saveMe(n); el("whoScrim").hidden=true; render();
});

/* ---------- the list ---------- */
function load(){
  var from=iso(dateFor(0)), to=iso(dateFor(1));
  el("d0").textContent=nice(dateFor(0)); el("d1").textContent=nice(dateFor(1));
  var jobs=[
    fetch(URL_+"/rest/v1/v_job_status?job_date=gte."+from+"&job_date=lte."+to+
          "&select=*&order=priority.desc,item_text",{headers:H})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }),
    /* the daily run-through's ticks for these two days */
    fetch(URL_+"/rest/v1/job_log?job_date=gte."+from+"&job_date=lte."+to+
          "&item_id=like.daily-*&select=item_id,action,who,note,photo_id,at,job_date"+
          "&order=at.desc",{headers:H}).then(function(r){ return r.ok?r.json():[]; }),
    /* photos taken on the board against each job - the last month, since a
       carried job keeps its photos from the day they were taken */
    fetch(URL_+"/rest/v1/photos?id=gte."+iso(new Date(Date.now()-35*86400000))+"&select=id,data",{headers:H})
      .then(function(r){ return r.ok?r.json():[]; }),
    /* who is on site these two days */
    fetch(URL_+"/rest/v1/v_labour_day?job_date=gte."+from+"&job_date=lte."+to+
          "&select=*",{headers:H}).then(function(r){ return r.ok?r.json():[]; })
  ];
  var needCfg = (!daily || !trades);
  if(needCfg) jobs.push(
    fetch(URL_+"/rest/v1/config?id=in.(daily,board)&select=id,data",{headers:H})
      .then(function(r){ return r.ok?r.json():[]; }));
  var cfgAt = needCfg ? 4 : -1;
  Promise.all(jobs).then(function(res){
    rows=res[0]||[];
    dlog={};
    (res[1]||[]).forEach(function(l){ if(!dlog[l.item_id]) dlog[l.item_id]=l; });
    jobPh={}; var seenPh={};
    (res[2]||[]).forEach(function(d){
      ((d.data&&d.data.items)||[]).forEach(function(ph){
        /* a job's photos are carried day to day with it, so the same photo sits
           in several days' records - show each one once */
        if(ph&&ph.job&&ph.id&&!seenPh[ph.id]){ seenPh[ph.id]=1; (jobPh[ph.job]=jobPh[ph.job]||[]).push(ph); }
      });
    });
    crew=res[3]||[];
    if(cfgAt>0 && res[cfgAt]) res[cfgAt].forEach(function(c){
      if(c.id==="daily") daily=c.data;
      if(c.id==="board" && c.data && c.data.trades) trades=c.data.trades;
    });
    render();
    var n=new Date();
    el("stamp").textContent="Checked "+p2(n.getHours())+":"+p2(n.getMinutes());
  }).catch(function(){
    el("stamp").textContent="Can't reach the board \u2014 showing the last load";
  });
}

/* The standing list, materialised for one day. Each day gets its own ids
   (daily-stairs-2026-11-11) so yesterday's tick never carries into today -
   a daily is only done if it was done today. */
function dailyFor(dateStr){
  var items=(daily&&daily.items)||[];
  return items.map(function(it){
    var id="daily-"+it.n+"-"+dateStr, l=dlog[id];
    var isDone = !!(l && l.action==="done");
    return {item_id:id, item_text:it.text, job_date:dateStr, priority:false,
            assigned:null, carried_from:null, crew_added:false, isDaily:true,
            done:isDone,
            done_by:   isDone ? l.who      : null,
            done_at:   isDone ? l.at       : null,
            done_note: isDone ? (l.note||null)     : null,
            done_photo:isDone ? (l.photo_id||null) : null};
  });
}

function shortDay(d){
  var x = (d instanceof Date) ? d : new Date(d);
  return x.getDate()+" "+MONS[x.getMonth()];
}
/* Days a job has been carried. This is the thing worth seeing - the date it
   was raised tells you far less than the fact it has been open eight days. */
function ageOf(from){
  if(!from) return null;
  var a=new Date(from+"T00:00:00"), b=new Date(); b.setHours(0,0,0,0);
  var d=Math.round((b-a)/86400000);
  return d>0 ? d : null;
}

function jobRow(j){
  var cls="job"+(j.done?" done":"")+(j.priority&&!j.done?" pri":"");
  var meta=[];

  if(j.assigned) meta.push('<span class="who">'+esc(j.assigned)+'</span>');
  if(j.crew_added) meta.push('<span class="tagnew">Added on site</span>');
  var age=j.done?null:ageOf(j.carried_from);
  if(age) meta.push('<span class="age'+(age>=14?" hot":age>=7?" warm":"")+'">'+
                    age+' day'+(age===1?'':'s')+'</span>');

  var ev="";
  if(j.done){
    var when=j.done_at?new Date(j.done_at):null;
    var line=(j.done_by?'<b>'+esc(j.done_by)+'</b>':'');
    if(when) line+=(line?' ':'')+shortDay(when)+', '+
      (function(h,m){var ap=h<12?'am':'pm',t=h%12||12;return t+':'+p2(m)+ap})(when.getHours(),when.getMinutes());
    if(j.done_note) line+=(line?' &mdash; ':'')+esc(j.done_note);
    ev='<span class="ev">'+line+'</span>';
    if(j.done_photo) ev+='<span class="evimg"><img src="'+photoURL(esc(j.done_photo))+'" alt="" loading="lazy"></span>';
  }
  /* photos taken on the board for this job */
  var bp=jobPh[j.item_id]||[], phs="";
  if(bp.length) phs='<div class="jphs">'+bp.map(function(ph){
    return '<a href="'+esc(boardPhotoURL(ph))+'" target="_blank" rel="noopener"><img src="'+esc(boardPhotoURL(ph))+'" alt="'+esc(ph.cap||"Job photo")+'" loading="lazy"></a>';
  }).join("")+'</div>';

  /* The star has to live outside the row button - a button inside a button
     is not a thing, and on a phone the two would fight over the same tap. */
  return '<div class="jobrow'+(j.done?' done':'')+'">'+
    '<div class="jmain">'+
    '<button class="'+cls+'" data-id="'+esc(j.item_id)+'" type="button">'+
      '<span class="box">&#10003;</span>'+
      '<span><span class="jt">'+esc(j.item_text)+'</span>'+
      ((meta.length||!(j.done||/^daily-/.test(j.item_id)))?'<span class="meta'+(!(j.done||/^daily-/.test(j.item_id))?' withpri':'')+'">'+meta.join("")+'</span>':'')+ev+'</span>'+
    '</button>'+
    ((j.done||/^daily-/.test(j.item_id))?'':'<select class="prisel'+(j.priority?' on':'')+'" data-star="'+esc(j.item_id)+'" aria-label="Priority">'+
      '<option value="1"'+(j.priority?' selected':'')+'>Priority</option>'+
      '<option value="0"'+(j.priority?'':' selected')+'>Non-pri</option></select>')+
    '</div>'+
    phs+'</div>';
}

/* A priority change is its own line in the record, same as the sheet writes,
   so you can see who raised it and when. The star flips straight away and
   puts itself back if the write does not land - nobody watches a spinner on
   a star. */
async function starJob(id, btn){
  if(!me){ askWho(); return; }
  var j=rows.filter(function(x){return x.item_id===id})[0]
        || dailyFor(iso(dateFor(day))).filter(function(x){return x.item_id===id})[0];
  if(!j) return;
  var want=btn.value==="1";
  if(want===!!j.priority) return;
  btn.disabled=true;
  btn.classList.toggle("on",want);
  try{
    await logRows([{item_id:id, job_date:j.job_date, action: want?"pri":"unpri",
      item_text:j.item_text, who:me, note:"", photo_id:""}]);
    j.priority=want;
    load();
  }catch(e){
    btn.value=want?"0":"1"; btn.classList.toggle("on",!want);
    toast("Couldn't change it - try again");
  }
  btn.disabled=false;
}

function sec(cls,title,count,hint){
  return '<div class="sec'+(cls?" "+cls:"")+'"><h2>'+esc(title)+'</h2>'+
    '<span class="n">'+count+'</span>'+
    (hint?'<span class="hint">'+esc(hint)+'</span>':'')+'</div>';
}
/* each list folds up under its heading - tap the heading. Remembered on this
   phone; Completed starts folded so the open work is what you see first */
var FOLD={"Completed":true};
try{ var fz=JSON.parse(localStorage.getItem("elise.jobs.fold")||"null"); if(fz) FOLD=fz; }catch(e){}
function fsec(cls,title,count,hint,body){
  var shut=!!FOLD[title];
  return '<div class="sec fold'+(cls?" "+cls:"")+(shut?" shut":"")+'" data-fold="'+esc(title)+'" role="button" tabindex="0" aria-expanded="'+(!shut)+'">'+
    '<h2>'+esc(title)+'</h2><span class="n">'+count+'</span>'+
    (hint?'<span class="hint">'+esc(hint)+'</span>':'')+'<span class="chev">&#9662;</span></div>'+
    '<div class="foldbody"'+(shut?' hidden':'')+'>'+body+'</div>';
}
document.addEventListener("click",function(e){
  var h=e.target.closest&&e.target.closest("[data-fold]"); if(!h) return;
  var t=h.getAttribute("data-fold"); FOLD[t]=!FOLD[t];
  try{ localStorage.setItem("elise.jobs.fold",JSON.stringify(FOLD)); }catch(_){}
  h.classList.toggle("shut",FOLD[t]); h.setAttribute("aria-expanded",String(!FOLD[t]));
  var b=h.nextElementSibling; if(b&&b.classList.contains("foldbody")) b.hidden=FOLD[t];
});

document.addEventListener("click",function(e){
  var t=e.target.closest&&e.target.closest("[data-view]"); if(!t) return;
  var v=t.getAttribute("data-view");
  if(v==="add"){ el("addBtn").click(); return; }
  view=v==="home"?null:v; render(); window.scrollTo(0,0);
});
function render(){
  paintMe();
  var want=iso(dateFor(day));
  var mine=rows.filter(function(j){return j.job_date===want});
  var pri =mine.filter(function(j){return !j.done && j.priority});
  var todo=mine.filter(function(j){return !j.done && !j.priority});
  var done=mine.filter(function(j){return j.done});
  var dl  =dailyFor(want);
  var dDone=dl.filter(function(x){return x.done}).length;

  var html="";
  /* home is a set of tiles, like the board; tap one to see just that list */
  var SECS={
    pri:{t:"Priority",n:pri.length,sub:pri.length?pri.length+" to do":"None",body:'<div class="dwrap pwrap">'+pri.map(jobRow).join("")+'</div>',cls:"pri"},
    todo:{t:"Non-priority",n:todo.length,sub:todo.length?todo.length+" to do":"None",body:'<div class="dwrap nwrap">'+todo.map(jobRow).join("")+'</div>',cls:""},
    daily:{t:"Daily",n:dl.length,sub:dl.length?dDone+" of "+dl.length+" done":"None today",body:'<div class="dwrap">'+dl.map(jobRow).join("")+'</div>',cls:"daily",hint:(daily&&daily.note)||""},
    done:{t:"Completed",n:done.length,sub:done.length?done.length+" done":"Nothing yet",body:done.map(jobRow).join(""),cls:""}
  };
  var onToday=crew.filter(function(c){return c.job_date===want;}).length;
  if(!view||(!SECS[view]&&view!=="crew")){
    view=null;
    var IC={pri:'<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',
      todo:'<rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M8 9h8M8 13h8M8 17h5"/>',
      daily:'<path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"/><path d="M12 8v4l3 2"/>',
      done:'<circle cx="12" cy="12" r="8.5"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/>'};
    html='<div class="tiles">'+["pri","todo","daily","done"].map(function(k){var S=SECS[k];
      return '<button type="button" class="tile'+(k==="pri"&&S.n?" hot":"")+'" data-view="'+k+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+IC[k]+'</svg><b>'+esc(S.t)+'</b><span>'+esc(S.sub)+'</span>'+(k==="pri"&&S.n?'<i>'+S.n+'</i>':'')+'</button>';}).join("")+
      '<button type="button" class="tile" data-view="add"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg><b>Add a job</b><span>Shows on the board</span></button>'+
      '<button type="button" class="tile" data-view="crew"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M2.5 19c0-3.2 2.5-5.5 5.5-5.5s5.5 2.3 5.5 5.5M14 14.2c3.3-.6 6.5 1.3 7 4.8"/></svg><b>On site</b><span>'+(onToday?onToday+" logged":"Nobody yet")+'</span></button></div>';
  }else{
    html='<button type="button" class="backbtn" data-view="home">&larr; All jobs</button>';
    if(view==="crew") html+='';
    else{var S=SECS[view];
      html+='<div class="sec '+S.cls+'"><h2>'+esc(S.t)+'</h2><span class="n">'+(view==="daily"?S.sub:S.n)+'</span>'+(S.hint?'<span class="hint">'+esc(S.hint)+'</span>':'')+'</div>'+
        (S.n?S.body:'<div class="empty"><b>Nothing here</b>'+(view==="done"?"Nothing ticked off yet for this day.":"No jobs in this list for this day.")+'</div>');}
  }
  el("crew").hidden=view!=="crew";
  el("addBtn").hidden=!(view==="pri"||view==="todo");
  el("list").innerHTML=html;
  Array.prototype.forEach.call(el("list").querySelectorAll("[data-id]"),function(b){
    b.addEventListener("click",function(){ openJob(b.getAttribute("data-id")); });
  });
  Array.prototype.forEach.call(el("list").querySelectorAll("[data-star]"),function(b){
    b.addEventListener("click",function(ev){ ev.stopPropagation(); });
    b.addEventListener("change",function(ev){
      ev.stopPropagation();
      starJob(b.getAttribute("data-star"), b);
    });
  });
  paintCrew(want);
}

/* Who is on the job. Context for the list above it, not something to act on,
   so it sits at the bottom and stays quiet. */
/* Trade colour for a labour supplier. ELISE is in the board's trade table so
   it gets the same olive it has everywhere else; the two labour-hire firms
   are not trades and carry their own colours. */
var SUPPLIER_COLOUR = { WORKCON:"#4FA3D1", HARWELL:"#C96A2E" };
function supplierColour(name){
  var n=String(name||"").trim().toUpperCase();
  if(!n) return "";
  if(SUPPLIER_COLOUR[n]) return SUPPLIER_COLOUR[n];
  var hit=(trades||[]).filter(function(t){
    return String(t[1]||"").toUpperCase()===n || String(t[0]||"").toUpperCase()===n;
  })[0];
  return (hit && hit[2]) ? hit[2] : "";
}

function paintCrew(want){
  var on=crew.filter(function(c){ return c.job_date===want; });
  var box=el("crew");
  if(!on.length){
    box.innerHTML='<div class="crew"><h3>On site</h3>'+
      '<p class="none">Nobody logged for this day yet. Names appear once the '+
      'hours go in of an evening.</p></div>';
    return;
  }
  box.innerHTML='<div class="crew"><h3>On site <span style="color:var(--ink3);'+
    'font-weight:700">'+on.length+'</span></h3><div class="chips">'+
    on.map(function(c){
      var sub=[c.area,c.task].filter(Boolean)[0]||"";
      var tint=supplierColour(c.supplier);
      var line=[c.supplier,sub].filter(Boolean).join(" \u00b7 ");
      return '<span class="chip'+(c.name===me?" me":"")+'"'+
             (tint?' style="border-left-color:'+tint+'"':'')+'><b>'+esc(c.name)+'</b>'+
             (line?'<span>'+esc(line)+'</span>':'')+'</span>';
    }).join("")+'</div></div>';
}

[0,1].forEach(function(i){
  el("t"+i).addEventListener("click",function(){
    day=i; el("t0").setAttribute("aria-selected",i===0?"true":"false");
    el("t1").setAttribute("aria-selected",i===1?"true":"false"); render();
  });
});

/* ---------- ticking one off ---------- */
function openJob(id){
  if(!me){ askWho(); return; }
  var j=rows.filter(function(x){return x.item_id===id})[0]
        || dailyFor(iso(dateFor(day))).filter(function(x){return x.item_id===id})[0];
  if(!j) return;
  pending=j; shotFile=null;
  el("jobHead").textContent = j.done ? "Reopen this job" : "Mark it done";
  el("jobText").textContent = j.item_text;
  el("jobNote").value=""; el("jobMsg").textContent="";
  el("shotImg").hidden=true; el("shotImg").removeAttribute("src");
  el("shotLab").textContent = j.done ? "Photo (optional)" : "Photo (required)";
  el("shotWrap").classList.remove("need");
  el("jobDone").textContent = j.done ? "Reopen it" : "Mark done";
  el("jobDone").className = j.done ? "btn" : "btn go";
  priWant = !!j.priority;
  paintPri();
  el("jobScrim").hidden=false;
}
function paintPri(){
  var b=el("priBtn");
  b.value = priWant?"1":"0"; b.classList.toggle("on",priWant);
  /* Marking something priority is not the same as finishing it, so the save
     for it appears on its own as soon as the toggle differs. */
  el("priSave").hidden = !pending || (priWant === !!pending.priority);
}

async function logRows(batch){
  var r = await fetch(URL_+"/rest/v1/job_log",{method:"POST",headers:JH,
          body:JSON.stringify(batch)});
  if(!r.ok) throw new Error(await r.text());
}

el("priSave").addEventListener("click", async function(){
  if(!pending) return;
  var b=el("priSave"); b.disabled=true;
  el("jobMsg").style.color="var(--ink3)"; el("jobMsg").textContent="Saving\u2026";
  try{
    await logRows([{item_id:pending.item_id, job_date:pending.job_date,
      action: priWant?"pri":"unpri", item_text:pending.item_text,
      who:me, note:"", photo_id:""}]);
    el("jobScrim").hidden=true; load();
  }catch(e){
    el("jobMsg").style.color="var(--stop)";
    el("jobMsg").textContent="Didn't save. Try again.";
  }
  b.disabled=false;
});
el("priBtn").addEventListener("change",function(){ priWant=this.value==="1"; paintPri(); });
el("jobCancel").addEventListener("click",function(){ el("jobScrim").hidden=true; });
el("shotBtn").addEventListener("keydown",function(e){
  if(e.key==="Enter"||e.key===" "){ e.preventDefault(); el("shotIn").click(); }
});
el("shotIn").addEventListener("change",function(){
  var f=el("shotIn").files && el("shotIn").files[0]; if(!f) return;
  shotFile=f;
  el("shotWrap").classList.remove("need");
  if(el("jobMsg").textContent.indexOf("photo")>=0) el("jobMsg").textContent="";
  var fr=new FileReader();
  fr.onload=function(){ var im=el("shotImg"); im.src=fr.result; im.hidden=false; };
  fr.readAsDataURL(f);
});

/* Shrink before upload - a phone photo is several megabytes and the crew are
   on site wifi or a couple of bars of 4G. */
function shrink(file){
  return new Promise(function(res){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=1280, w=img.width, h=img.height;
        if(w>max||h>max){ if(w>h){h=Math.round(h*max/w);w=max;} else {w=Math.round(w*max/h);h=max;} }
        var c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        c.toBlob(function(b){ res(b||file); },"image/jpeg",.82);
      };
      img.onerror=function(){ res(file); };
      img.src=fr.result;
    };
    fr.onerror=function(){ res(file); };
    fr.readAsDataURL(file);
  });
}

el("jobDone").addEventListener("click", async function(){
  if(!pending) return;
  /* No photo, no close-out. Reopening is exempt - there is nothing to show. */
  if(!pending.done && !shotFile){
    el("jobMsg").style.color="var(--stop)";
    el("jobMsg").textContent="Take a photo of the finished job before you close it out.";
    el("shotWrap").classList.add("need");
    el("shotWrap").scrollIntoView({block:"center",behavior:"smooth"});
    return;
  }
  var btn=el("jobDone"); btn.disabled=true;
  el("jobMsg").style.color="var(--ink3)"; el("jobMsg").textContent="Saving…";
  var photoId="";
  try{
    if(shotFile){
      el("jobMsg").textContent="Uploading the photo…";
      var blob=await shrink(shotFile);
      photoId=newId();
      var up=await fetch(URL_+"/storage/v1/object/"+BUCKET+"/"+photoId+".jpg",{
        method:"POST", headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"image/jpeg"},
        body:blob });
      if(!up.ok){
        photoId="";
        el("jobMsg").style.color="var(--stop)";
        if(!pending.done){
          /* The photo is the record, so without it the job stays open. */
          el("jobMsg").textContent="The photo wouldn't upload. Try again when you've got signal — the job's still open.";
          btn.disabled=false; return;
        }
        el("jobMsg").textContent="Photo wouldn't upload — saving without it.";
      }
    }
    var batch=[];
    /* a priority change is its own line in the record, so you can see who
       raised it and when, not just that it is starred now */
    if(priWant !== !!pending.priority){
      batch.push({item_id:pending.item_id, job_date:pending.job_date,
        action: priWant?"pri":"unpri", item_text:pending.item_text,
        who:me, note:"", photo_id:""});
    }
    batch.push({item_id:pending.item_id, job_date:pending.job_date,
      action: pending.done ? "reopen" : "done", item_text:pending.item_text,
      who:me, note:el("jobNote").value.trim(), photo_id:photoId});
    var r=await fetch(URL_+"/rest/v1/job_log",{method:"POST",headers:JH,
      body:JSON.stringify(batch)});
    if(!r.ok) throw new Error(await r.text());
    el("jobScrim").hidden=true; load();
  }catch(e){
    el("jobMsg").style.color="var(--stop)";
    el("jobMsg").textContent="Didn't save. Try again in a moment.";
  }
  btn.disabled=false;
});

/* ---------- adding one ---------- */
el("addBtn").addEventListener("click",function(){
  if(!me){ askWho(); return; }
  el("addText").value=""; el("addMsg").textContent=""; el("addScrim").hidden=false;
});
el("addCancel").addEventListener("click",function(){ el("addScrim").hidden=true; });
el("addSave").addEventListener("click", async function(){
  var t=el("addText").value.trim();
  if(!t){ el("addMsg").textContent="Type what needs doing."; return; }
  var b=el("addSave"); b.disabled=true; el("addMsg").style.color="var(--ink3)";
  el("addMsg").textContent="Saving…";
  try{
    var r=await fetch(URL_+"/rest/v1/job_log",{method:"POST",headers:JH,
      body:JSON.stringify([{item_id:"crew-"+newId(), job_date:iso(dateFor(day)),
        action:"add", item_text:t, who:me, note:"", photo_id:""}])});
    if(!r.ok) throw new Error();
    el("addScrim").hidden=true; load();
  }catch(e){ el("addMsg").style.color="var(--stop)"; el("addMsg").textContent="Didn't save. Try again."; }
  b.disabled=false;
});

me=loadMe();
load();
if(!me) setTimeout(askWho, 600);
setInterval(load, 20000);
window.addEventListener("hashchange",function(){
  var d=dayFromHash();
  if(d!==day){ day=d; load(); }
});
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible") load();
});
})();

<!doctype html>
<html lang="en-AU"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#23271A">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>ELISE Prestart Sign</title>
<style>
:root{--bg:#23271A;--card:#2D3221;--rule:#3E4431;--ink:#E8E2D8;--ink2:#C6C7B9;--ink3:#9EA090;--accent:#DCCAA2;--stop:#FF6B6B;--go:#2FD44A}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#E8E2D8;--card:#F5F1EA;--rule:#D2CBBC;--ink:#2D3221;--ink2:#4E5340;--ink3:#717462;--accent:#2D3221;--stop:#B3261E;--go:#2E7D32}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.logo{width:96px;height:22px;background:var(--ink);-webkit-mask:url(elise-logo.png) left center/contain no-repeat;mask:url(elise-logo.png) left center/contain no-repeat}
h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:14px 0 2px}
.date{font-size:22px;font-weight:700;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin:12px 0}
.card h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:0 0 6px}
.card p{margin:0;white-space:pre-wrap;line-height:1.45;font-size:15px}
.card.risk{border-color:var(--stop)}.card.risk h2{color:var(--stop)}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:12px 0 5px}
input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:6px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
canvas{display:block;width:100%;height:170px;background:#fff;border-radius:6px;touch-action:none}
.row{display:flex;gap:8px;margin-top:10px}
button{font:inherit;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:13px 14px;cursor:pointer;border:1px solid var(--rule);background:transparent;color:var(--ink)}
button.go{flex:1 1 auto;background:var(--accent);color:var(--bg);border-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:15px;line-height:1.35}
.check input{width:22px;height:22px;flex:0 0 auto;margin:0}
.msg{min-height:20px;margin-top:8px;font-size:14px}
.who{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px}
.who small{color:var(--ink3)}
.done{text-align:center;padding:20px 0}.done b{display:block;font-size:20px;color:var(--go);margin-bottom:6px}
.muted{color:var(--ink3);font-size:14px}
</style></head><body><div class="wrap">
<div class="logo" role="img" aria-label="ELISE"></div>
<h1>High risk prestart</h1>
<div class="date" id="date"></div>
<div id="body"><p class="muted">Loading the prestart&hellip;</p></div>
<div id="form" hidden>
  <div class="card">
    <h2>Sign on</h2>
    <label for="nm">Your name</label><input id="nm" autocomplete="name" maxlength="80">
    <label for="co">Company</label><input id="co" autocomplete="organization" maxlength="80">
    <label>Signature</label><canvas id="cv"></canvas>
    <div class="check"><input type="checkbox" id="ok"><span>I was at the prestart, I understand the high risk works and the controls, and I will follow them.</span></div>
    <div class="row"><button type="button" id="clr">Clear</button><button type="button" class="go" id="go">Sign</button></div>
    <div class="msg" id="msg"></div>
  </div>
</div>
<div class="card" id="whoBox" hidden><h2>Signed so far</h2><div id="who"></div></div>
</div>
<script>
var URL_="https://glusxwsivbbzmgwizkfs.supabase.co", KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdsdXN4d3NpdmJiem1nd2l6a2ZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMTcyNDQsImV4cCI6MjEwOTc5MzI0NH0.Ft-_9gst873leku1VVJ1PoTwZNTFiB_AoPzDNYdsqaI";
var H={"apikey":KEY,"Authorization":"Bearer "+KEY};
function el(i){return document.getElementById(i);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function pad(n){return n<10?"0"+n:""+n;}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
var q=new URLSearchParams(location.search), DAY=/^\d{4}-\d{2}-\d{2}$/.test(q.get("d")||"")?q.get("d"):today();
var DN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
(function(){var p=DAY.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);el("date").textContent=DN[d.getDay()]+" "+d.getDate()+" "+MN[d.getMonth()]+" "+d.getFullYear();})();
try{var m=JSON.parse(localStorage.getItem("elise.sign.me")||"{}");el("nm").value=m.n||"";el("co").value=m.c||"";}catch(e){}

function block(t,v,cls,empty){
  return '<div class="card'+(cls?" "+cls:"")+'"><h2>'+esc(t)+'</h2>'+(v?'<p>'+esc(v)+'</p>':'<p class="muted">'+(empty||"Not filled in yet")+'</p>')+'</div>';
}
function hm(m){var h=Math.floor(m/60),mi=m%60,ap=h<12?"am":"pm";return (h%12||12)+(mi?":"+pad(mi):"")+ap;}
function getJ(u){return fetch(URL_+"/rest/v1/"+u,{headers:H}).then(function(r){return r.ok?r.json():[];}).catch(function(){return [];});}
var shownOnce=false;
/* The whole prestart, as it stands - read again every 30 seconds so anything
   the site manager adds while people are signing turns up here too. */
function loadPrestart(){
  Promise.all([
    getJ("prestart?id=eq."+DAY+"&select=data"),
    getJ("lifts?date=eq."+DAY+"&select=start_min,dur,co,co2,descr,qty,type,crane,status&order=start_min.asc"),
    getJ("safety?select=id,data"),
    getJ("config?id=eq.prestart&select=data")
  ]).then(function(R){
    var d=(R[0][0]&&R[0][0].data)||null;
    if(!d){ if(!shownOnce) el("body").innerHTML='<p class="muted">The prestart for this day has not been started yet. This page will fill in as soon as it is.</p>'; return; }
    shownOnce=true;
    var lifts=R[1].filter(function(b){return b.type!=="del"&&b.crane!=="none";}), dels=R[1].filter(function(b){return b.type==="del"||b.crane==="none";});
    var by={}; lifts.forEach(function(b){var k=b.co2?b.co+"/"+b.co2:b.co,s=b.start_min,e=s+(+b.dur||0),g=by[k]||(by[k]={k:k,s:s,e:e,n:0,w:[]});g.s=Math.min(g.s,s);g.e=Math.max(g.e,e);g.n+=Math.max(1,+b.qty||1);var w=String(b.descr||"").split(/\s+-\s+|\(/)[0].trim();if(w&&g.w.indexOf(w)<0)g.w.push(w);});
    var liftTxt=Object.keys(by).map(function(k){return by[k];}).sort(function(a,b){return a.s-b.s;}).map(function(g){return hm(g.s)+"-"+hm(g.e)+"  "+g.k+"  "+g.n+(g.n===1?" lift":" lifts")+(g.w.length?" - "+g.w.join(", "):"");}).join("\n");
    var delTxt=dels.map(function(b){return hm(b.start_min)+"  "+b.co+"  "+(b.descr||"")+(b.status==="req"?" (TBC)":"");}).join("\n");
    var open=[]; R[2].forEach(function(r){(r.data&&r.data.items||[]).forEach(function(i){if(!i.done&&(r.id<=DAY))open.push((i.kind==="INC"?"Incident: ":i.kind==="CRIT"?"Critical: ":"")+i.text);});});
    var checks=((R[3][0]&&R[3][0].data&&R[3][0].data.items)||[]), ticks=d.ticks||{};
    var chkTxt=checks.map(function(c){return "\u2022 "+c.text;}).join("\n");
    el("body").innerHTML=
      (d.type==="hr"?"":'<p class="muted">This is the daily prestart.</p>')+
      block("High risk works",d.risk,"risk","None listed yet - ask the site manager before you start")+
      block("Weather",d.weather)+
      block("Structures",d.works)+
      block("Finishes",d.finishes)+
      block("Crane lifts",liftTxt,"","No crane lifts booked")+
      block("Deliveries",delTxt,"","No deliveries booked")+
      (d.safety?block("Safety notes",d.safety):"")+
      block("Open safety items",open.join("\n"),"","Nothing open")+
      (chkTxt?block("Safety",chkTxt):"")+
      (d.by?'<p class="muted">Run by '+esc(d.by)+'</p>':"");
    el("form").hidden=false;
  });
}
var signedHere=false;
loadPrestart(); setInterval(function(){ if(document.visibilityState==="visible") loadPrestart(); },30000);

function loadWho(){
  fetch(URL_+"/rest/v1/prestart_sign?day=eq."+DAY+"&select=name,company,at&order=at.asc",{headers:H}).then(function(r){return r.ok?r.json():[];}).then(function(L){
    el("whoBox").hidden=!L.length;
    el("who").innerHTML=L.map(function(r){var t=new Date(r.at);return '<div class="who"><span>'+esc(r.name)+' <small>'+esc(r.company||"")+'</small></span><small>'+pad(t.getHours())+":"+pad(t.getMinutes())+'</small></div>';}).join("");
  }).catch(function(){});
}
loadWho();

var cv=el("cv"),cx,down=false,inked=false;
function sizeCv(){cv.width=640;cv.height=200;cx=cv.getContext("2d");cx.lineWidth=3.2;cx.lineCap="round";cx.lineJoin="round";cx.strokeStyle="#111";inked=false;}
sizeCv();
function pt(e){var b=cv.getBoundingClientRect();return[(e.clientX-b.left)*cv.width/b.width,(e.clientY-b.top)*cv.height/b.height];}
cv.addEventListener("pointerdown",function(e){down=true;cv.setPointerCapture(e.pointerId);var p=pt(e);cx.beginPath();cx.moveTo(p[0],p[1]);});
cv.addEventListener("pointermove",function(e){if(!down)return;var p=pt(e);cx.lineTo(p[0],p[1]);cx.stroke();inked=true;});
cv.addEventListener("pointerup",function(){down=false;});
el("clr").onclick=function(){cx.clearRect(0,0,cv.width,cv.height);inked=false;};
el("go").onclick=function(){
  var nm=el("nm").value.trim(),co=el("co").value.trim(),msg=el("msg");
  msg.style.color="var(--stop)";
  if(!nm){msg.textContent="Put your name in.";el("nm").focus();return;}
  if(!inked){msg.textContent="Sign in the white box.";return;}
  if(!el("ok").checked){msg.textContent="Tick the box to say you were briefed.";return;}
  var b=el("go");b.disabled=true;msg.style.color="var(--ink3)";msg.textContent="Signing…";
  fetch(URL_+"/rest/v1/prestart_sign",{method:"POST",headers:Object.assign({"Content-Type":"application/json","Prefer":"return=minimal"},H),
    body:JSON.stringify({day:DAY,name:nm,company:co,sig:cv.toDataURL("image/png")})})
  .then(function(r){
    if(!r.ok) throw new Error(r.status);
    try{localStorage.setItem("elise.sign.me",JSON.stringify({n:nm,c:co}));}catch(e){}
    signedHere=true; el("form").innerHTML='<div class="card done"><b>Signed</b>Thanks '+esc(nm)+'. You can close this page.</div>';
    loadWho();
  }).catch(function(){b.disabled=false;msg.style.color="var(--stop)";msg.textContent="Didn’t go through. This link only works on the day — check your signal and try again.";});
};
</script>
</body></html>
